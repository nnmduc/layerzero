name: Build & Release Desktop (Linux & Windows)

# Releases are cut only from version tags (e.g. v2.3.0, or v2.3.0-beta.1 for a pre-release). Branch pushes are covered by ci.yml;
# publishing on a branch push would create a release and tag named after the branch.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (.AppImage & .deb)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            fuse \
            libfuse2

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Build Python FastAPI Sidecar (Linux x86_64)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt
          mkdir -p ../frontend/src-tauri/binaries
          pyinstaller --noconfirm --clean --onefile \
            --name "layerzero-backend-x86_64-unknown-linux-gnu" \
            --distpath "../frontend/src-tauri/binaries" \
            --add-data "schemas:schemas" \
            --add-data "vendor_profiles:vendor_profiles" \
            --hidden-import "uvicorn.logging" \
            --hidden-import "uvicorn.loops" \
            --hidden-import "uvicorn.loops.auto" \
            --hidden-import "uvicorn.protocols" \
            --hidden-import "uvicorn.protocols.http" \
            --hidden-import "uvicorn.protocols.http.auto" \
            --hidden-import "uvicorn.protocols.websockets" \
            --hidden-import "uvicorn.protocols.websockets.auto" \
            --hidden-import "uvicorn.lifespan" \
            --hidden-import "uvicorn.lifespan.on" \
            --hidden-import "multipart" \
            main.py
          chmod +x ../frontend/src-tauri/binaries/layerzero-backend-x86_64-unknown-linux-gnu

      - name: Build Tauri Linux Bundles (.deb & .AppImage)
        working-directory: frontend
        env:
          NO_STRIP: "true"
        run: |
          npm ci
          npx tauri build --bundles deb,appimage

      - name: Stage Linux Release Assets
        run: |
          # File names carry the tag's version (e.g. v2.3.0-beta.1 -> LayerZero_2.3.0-beta.1_...).
          V="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets
          cp frontend/src-tauri/target/release/bundle/appimage/*.AppImage "release-assets/LayerZero_${V}_Linux_x64.AppImage"
          cp frontend/src-tauri/target/release/bundle/deb/*.deb "release-assets/LayerZero_${V}_Linux_amd64.deb"
          ls -lh release-assets/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: layerzero-linux-x64
          path: release-assets/*

  build-windows:
    name: Build Windows (.exe & .msi)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri -> target"

      - name: Build Python FastAPI Sidecar (Windows x86_64)
        working-directory: backend
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          pip install -r requirements.txt
          New-Item -ItemType Directory -Force -Path "../frontend/src-tauri/binaries" | Out-Null
          pyinstaller --noconfirm --clean --onefile `
            --name "layerzero-backend-x86_64-pc-windows-msvc" `
            --distpath "../frontend/src-tauri/binaries" `
            --add-data "schemas;schemas" `
            --add-data "vendor_profiles;vendor_profiles" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.protocols.websockets" `
            --hidden-import "uvicorn.protocols.websockets.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --hidden-import "multipart" `
            main.py

      - name: Build Tauri Windows Installers (NSIS .exe & .msi)
        working-directory: frontend
        shell: pwsh
        run: |
          npm ci
          npx tauri build --bundles nsis,msi

      - name: Stage Windows Release Assets
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1 | Copy-Item -Destination "release-assets/LayerZero_${v}_Windows_x64-setup.exe"
          Get-ChildItem "frontend/src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1 | Copy-Item -Destination "release-assets/LayerZero_${v}_Windows_x64.msi"
          Get-ChildItem "release-assets"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: layerzero-windows-x64
          path: release-assets/*

  publish-release:
    name: Publish to GitHub Releases
    needs: [build-linux, build-windows]
    # Manual runs from a branch only build artifacts; only version tags publish a release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write Release Notes
        # A tag with a pre-release suffix (v2.3.0-beta.1) publishes a GitHub pre-release for testers;
        # its macOS DMGs are shared privately instead of being linked from the public download host.
        run: |
          V="${GITHUB_REF_NAME#v}"
          {
            echo "## LayerZero Studio v${V} — Universal \`.3mf\` AI Printability & Aesthetics Optimizer"
            echo
            if [[ "$V" == *-* ]]; then
              echo "> **Beta for the tester group.** See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for what changed."
              echo
              echo "#### 🍎 macOS: signed DMGs are shared with testers directly."
            else
              echo "#### 🍎 macOS (Apple Developer ID Signed)"
              echo "- **Apple Silicon (M1 – M4)**: [LayerZero_${V}_Apple_Silicon_arm64.dmg](https://dl.layerzero.io.vn/LayerZero_${V}_Apple_Silicon_arm64.dmg)"
              echo "- **Mac Intel (x86_64)**: [LayerZero_${V}_Intel_x64.dmg](https://dl.layerzero.io.vn/LayerZero_${V}_Intel_x64.dmg)"
            fi
            echo
            echo "#### 🪟 Windows (Windows 10 / 11 64-bit)"
            echo "- **Windows Installer (NSIS \`.exe\`)**: \`LayerZero_${V}_Windows_x64-setup.exe\` *(Attached below)*"
            echo "- **Windows MSI Package (\`.msi\`)**: \`LayerZero_${V}_Windows_x64.msi\` *(Attached below)*"
            echo
            echo "#### 🐧 Linux (Ubuntu / Debian / Fedora / Arch x86_64)"
            echo "- **Universal AppImage**: \`LayerZero_${V}_Linux_x64.AppImage\` *(Attached below — \`chmod +x\` and run)*"
            echo "- **Ubuntu / Debian Package (\`.deb\`)**: \`LayerZero_${V}_Linux_amd64.deb\` *(Attached below — \`sudo apt install ./LayerZero_${V}_Linux_amd64.deb\`)*"
          } > release-notes.md
          cat release-notes.md

      - name: Publish / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "LayerZero Studio ${{ github.ref_name }} (macOS · Windows · Linux)"
          body_path: release-notes.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
